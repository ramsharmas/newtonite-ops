<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Newtonite Ops</title>
	<link rel="stylesheet" href="styles.css">
	<script src="app.js" defer></script>
</head>
<body>

<section id="signin" class="signin" hidden>
	<div class="signin-card">
		<h1>Newtonite Ops</h1>
		<p class="muted">Demo sign-in, no passwords. Pick a person. Each browser tab has its own sign-in, so open a second tab to be two people at once.</p>
		<div id="people" class="people"></div>
	</div>
</section>

<div id="app" hidden>
	<header class="topbar">
		<span class="brand">Newtonite Ops</span>
		<input id="search" type="search" placeholder="Search titles and descriptions" aria-label="Search items">
		<button id="new-item-button" class="btn primary" type="button">New item</button>
		<div class="inbox-wrap">
			<button id="bell" class="btn ghost bell" type="button" aria-label="Notifications" aria-expanded="false">
				<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z" fill="currentColor"/></svg>
				<span id="unread" class="badge" hidden></span>
			</button>
			<div id="inbox" class="inbox" hidden>
				<div class="inbox-head">
					<strong>Notifications</strong>
					<button id="mark-read" class="link" type="button">Mark all read</button>
				</div>
				<ul id="inbox-list"></ul>
			</div>
		</div>
		<span id="me-name" class="me"></span>
		<button id="sign-out" class="btn ghost" type="button">Sign out</button>
	</header>

	<div class="filters">
		<label>Team <select id="filter-team"><option value="">All my teams</option></select></label>
		<label>Status
			<select id="filter-status">
				<option value="active">Open and in progress</option>
				<option value="">Any status</option>
				<option value="open">Open</option>
				<option value="in_progress">In progress</option>
				<option value="resolved">Resolved</option>
				<option value="closed">Closed</option>
				<option value="cancelled">Cancelled</option>
			</select>
		</label>
		<label>Owner
			<select id="filter-assigned">
				<option value="">Anyone</option>
				<option value="me">Me</option>
				<option value="unassigned">Nobody yet</option>
			</select>
		</label>
		<label>Sort
			<select id="filter-sort">
				<option value="updated">Recently updated</option>
				<option value="priority">Priority</option>
				<option value="created">Newest</option>
			</select>
		</label>
	</div>

	<main class="layout">
		<ul id="list" class="list" aria-label="Work items"></ul>
		<section id="detail" class="detail" aria-live="polite">
			<p class="empty">Pick an item to see it here.</p>
		</section>
	</main>
</div>

<dialog id="new-item">
	<form id="new-item-form">
		<h2>New work item</h2>
		<label>Team <select name="teamId" required></select></label>
		<label>Title <input name="title" required maxlength="200" autocomplete="off"></label>
		<label>Description <textarea name="description" rows="4" maxlength="4000"></textarea></label>
		<div class="row">
			<label>Priority
				<select name="priority">
					<option value="urgent">Urgent</option>
					<option value="high">High</option>
					<option value="medium" selected>Medium</option>
					<option value="low">Low</option>
				</select>
			</label>
			<label>Kind
				<select name="kind">
					<option value="task">Task</option>
					<option value="incident">Incident</option>
				</select>
			</label>
		</div>
		<label class="check"><input type="checkbox" name="requiresApproval"> Needs a lead's approval before it can be resolved</label>
		<div class="dialog-buttons">
			<button type="button" class="btn ghost" id="new-item-cancel">Cancel</button>
			<button type="submit" class="btn primary">Create item</button>
		</div>
	</form>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

</body>
</html>
