spring.application.name=newtonite-ops
server.port=${PORT:8080}

# H2 keeps its data in ./data so items survive a restart. Delete that folder to start fresh.
spring.datasource.url=jdbc:h2:file:./data/newtonite
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fills an empty database with 6 people, 4 teams and a handful of work items.
newtonite.seed-demo-data=true

# Optional: also generate this many extra items, to try the app at a larger size.
#   ./mvnw spring-boot:run -Dspring-boot.run.arguments=--newtonite.seed-bulk-items=20000
newtonite.seed-bulk-items=0

# An open or in-progress item with no activity for this long counts as "stale" (possibly forgotten).
newtonite.stale-after-hours=24

# How long a sign-in token works.
newtonite.auth.token-ttl-hours=12

# Background worker that turns queued jobs into notifications.
newtonite.jobs.enabled=true
newtonite.jobs.poll-ms=1000
newtonite.jobs.max-attempts=5
